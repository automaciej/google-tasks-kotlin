jdk:
  - openjdk21
# -PjitpackBuild=true disables the wasmJs proof-of-concept target for this build — see the
# comment in build.gradle.kts for why (JitPack can't reliably resolve task-sync-kotlin's
# multi-target Gradle module metadata).
install:
  - ./gradlew clean assemble publishToMavenLocal -PjitpackBuild=true -Pgroup=com.github.automaciej -Pversion=$VERSION
